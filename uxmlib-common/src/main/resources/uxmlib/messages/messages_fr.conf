# The words the library's own windows ask for.
#
# The menu engine draws a few screens nobody wrote a file for: the confirm prompt, the page
# arrows a long list grows, the colour picker, and the acknowledgement a cancelled prompt
# sends. Those screens name a key and ask the plugin's catalogue for it, and a plugin that
# holds no line for one of them used to put the key itself on the screen.
#
# This file is that floor. It is read from inside the jar, underneath the plugin's own
# language files, so a key written in messages_<tag>.conf of the plugin wins over the line
# here. An operator who wants other words writes the key in their own file.
#
# Every line names a role and never a colour, like every other line of the suite: <value> is
# a name, <accent> is the brand, <bad> refuses. theme.conf says what those are.

"gui.input.cancelled" = "<tag:'INPUT'> saisie annulée."
"gui.input.cancel-hint" = "<muted>(tape <value><keyword></value> pour annuler)</muted>"
"gui.input.submit" = "Confirmer"
"gui.input.cancel" = "Annuler"
"gui.confirm.yes" = "<value>confirmer</value>"
"gui.confirm.no" = "<bad>annuler</bad>"
"gui.page.previous" = "<accent>← page précédente</accent>"
"gui.page.next" = "<accent>→ page suivante</accent>"
"gui.colour-picker.title" = "<accent>choisir une couleur</accent>"
"gui.colour-picker.custom" = "<cta>hex personnalisé</cta>"
"gui.colour-picker.custom-prompt" = "<cta>tape une couleur hex, ex. #ff5733</cta>"
"gui.colour-picker.clear" = "<bad>effacer la couleur</bad>"
"gui.colour-picker.back" = "<accent>← retour</accent>"
"gui.colour.white" = "<value>blanc</value>"
"gui.colour.orange" = "<value>orange</value>"
"gui.colour.magenta" = "<value>magenta</value>"
"gui.colour.light-blue" = "<value>bleu clair</value>"
"gui.colour.yellow" = "<value>jaune</value>"
"gui.colour.lime" = "<value>citron vert</value>"
"gui.colour.pink" = "<value>rose</value>"
"gui.colour.gray" = "<value>gris</value>"
"gui.colour.light-gray" = "<value>gris clair</value>"
"gui.colour.cyan" = "<value>cyan</value>"
"gui.colour.purple" = "<value>violet</value>"
"gui.colour.blue" = "<value>bleu</value>"
"gui.colour.brown" = "<value>marron</value>"
"gui.colour.green" = "<value>vert</value>"
"gui.colour.red" = "<value>rouge</value>"
"gui.colour.black" = "<value>noir</value>"
