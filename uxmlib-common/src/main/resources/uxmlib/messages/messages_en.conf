# The words the library's own windows ask for.
#
# The menu engine draws a few screens nobody wrote a file for: the confirm prompt, the page
# arrows a long list grows, the colour picker, and the acknowledgement a cancelled prompt
# sends. Those screens name a key and ask the plugin's catalogue for it, and a plugin that
# holds no line for one of them used to put the key itself on the screen.
#
# This file is that floor. It is read from inside the jar, underneath the plugin's own
# language files, so a key written in messages_<tag>.conf of the plugin wins over the line
# here. An operator who wants other words writes the key in their own file.
#
# Every line names a role and never a colour, like every other line of the suite: <value> is
# a name, <accent> is the brand, <bad> refuses. theme.conf says what those are.

"gui.input.cancelled" = "<tag:'INPUT'> input cancelled."
"gui.input.cancel-hint" = "<muted>(type <value><keyword></value> to cancel)</muted>"
"gui.input.submit" = "Confirm"
"gui.input.cancel" = "Cancel"
"gui.confirm.yes" = "<value>confirm</value>"
"gui.confirm.no" = "<bad>cancel</bad>"
"gui.page.previous" = "<accent>← previous page</accent>"
"gui.page.next" = "<accent>→ next page</accent>"
"gui.colour-picker.title" = "<accent>pick a colour</accent>"
"gui.colour-picker.custom" = "<cta>custom hex</cta>"
"gui.colour-picker.custom-prompt" = "<cta>type a hex colour, e.g. #ff5733</cta>"
"gui.colour-picker.clear" = "<bad>clear colour</bad>"
"gui.colour-picker.back" = "<accent>← back</accent>"
"gui.colour.white" = "<value>white</value>"
"gui.colour.orange" = "<value>orange</value>"
"gui.colour.magenta" = "<value>magenta</value>"
"gui.colour.light-blue" = "<value>light blue</value>"
"gui.colour.yellow" = "<value>yellow</value>"
"gui.colour.lime" = "<value>lime</value>"
"gui.colour.pink" = "<value>pink</value>"
"gui.colour.gray" = "<value>gray</value>"
"gui.colour.light-gray" = "<value>light gray</value>"
"gui.colour.cyan" = "<value>cyan</value>"
"gui.colour.purple" = "<value>purple</value>"
"gui.colour.blue" = "<value>blue</value>"
"gui.colour.brown" = "<value>brown</value>"
"gui.colour.green" = "<value>green</value>"
"gui.colour.red" = "<value>red</value>"
"gui.colour.black" = "<value>black</value>"
