# The words the library's own windows ask for.
#
# The menu engine draws a few screens nobody wrote a file for: the confirm prompt, the page
# arrows a long list grows, the colour picker, and the acknowledgement a cancelled prompt
# sends. Those screens name a key and ask the plugin's catalogue for it, and a plugin that
# holds no line for one of them used to put the key itself on the screen.
#
# This file is that floor. It is read from inside the jar, underneath the plugin's own
# language files, so a key written in messages_<tag>.conf of the plugin wins over the line
# here. An operator who wants other words writes the key in their own file.
#
# Every line names a role and never a colour, like every other line of the suite: <value> is
# a name, <accent> is the brand, <bad> refuses. theme.conf says what those are.

"gui.input.cancelled" = "<tag:'INPUT'> wprowadzanie anulowane."
"gui.input.cancel-hint" = "<muted>(wpisz <value><keyword></value>, aby anulować)</muted>"
"gui.input.submit" = "Potwierdź"
"gui.input.cancel" = "Anuluj"
"gui.confirm.yes" = "<value>potwierdź</value>"
"gui.confirm.no" = "<bad>anuluj</bad>"
"gui.page.previous" = "<accent>← poprzednia strona</accent>"
"gui.page.next" = "<accent>→ następna strona</accent>"

"gui.gesture.title" = "<accent>co zrobic</accent>"
"gui.gesture.left" = "<value>lewy klik</value>"
"gui.gesture.right" = "<value>prawy klik</value>"
"gui.gesture.shift-left" = "<value>shift lewy klik</value>"
"gui.gesture.shift-right" = "<value>shift prawy klik</value>"
"gui.gesture.middle" = "<value>srodkowy klik</value>"
"gui.gesture.drop" = "<value>wyrzuc</value>"
"gui.gesture.control-drop" = "<value>control wyrzuc</value>"
"gui.gesture.double-click" = "<value>podwojny klik</value>"

"gui.colour-picker.title" = "<accent>wybierz kolor</accent>"
"gui.colour-picker.custom" = "<cta>własny hex</cta>"
"gui.colour-picker.custom-prompt" = "<cta>wpisz kolor hex, np. #ff5733</cta>"
"gui.colour-picker.clear" = "<bad>wyczyść kolor</bad>"
"gui.colour-picker.back" = "<accent>← wstecz</accent>"
