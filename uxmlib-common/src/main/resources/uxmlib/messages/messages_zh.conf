# The words the library's own windows ask for.
#
# The menu engine draws a few screens nobody wrote a file for: the confirm prompt, the page
# arrows a long list grows, the colour picker, and the acknowledgement a cancelled prompt
# sends. Those screens name a key and ask the plugin's catalogue for it, and a plugin that
# holds no line for one of them used to put the key itself on the screen.
#
# This file is that floor. It is read from inside the jar, underneath the plugin's own
# language files, so a key written in messages_<tag>.conf of the plugin wins over the line
# here. An operator who wants other words writes the key in their own file.
#
# Every line names a role and never a colour, like every other line of the suite: <value> is
# a name, <accent> is the brand, <bad> refuses. theme.conf says what those are.

"gui.input.cancelled" = "<tag:'INPUT'> 输入已取消。"
"gui.input.cancel-hint" = "<muted>(输入 <value><keyword></value> 取消)</muted>"
"gui.input.submit" = "确认"
"gui.input.cancel" = "取消"
"gui.confirm.yes" = "<value>确认</value>"
"gui.confirm.no" = "<bad>取消</bad>"
"gui.page.previous" = "<accent>← 上一页</accent>"
"gui.page.next" = "<accent>→ 下一页</accent>"
"gui.colour-picker.title" = "<accent>选个颜色</accent>"
"gui.colour-picker.custom" = "<cta>自定十六进制</cta>"
"gui.colour-picker.custom-prompt" = "<cta>输入十六进制颜色，例如 #ff5733</cta>"
"gui.colour-picker.clear" = "<bad>清除颜色</bad>"
"gui.colour-picker.back" = "<accent>← 返回</accent>"
"gui.colour.white" = "<value>白色</value>"
"gui.colour.orange" = "<value>橙色</value>"
"gui.colour.magenta" = "<value>品红</value>"
"gui.colour.light-blue" = "<value>淡蓝</value>"
"gui.colour.yellow" = "<value>黄色</value>"
"gui.colour.lime" = "<value>黄绿</value>"
"gui.colour.pink" = "<value>粉红</value>"
"gui.colour.gray" = "<value>灰色</value>"
"gui.colour.light-gray" = "<value>浅灰</value>"
"gui.colour.cyan" = "<value>青色</value>"
"gui.colour.purple" = "<value>紫色</value>"
