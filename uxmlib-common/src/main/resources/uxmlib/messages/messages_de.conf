# The words the library's own windows ask for.
#
# The menu engine draws a few screens nobody wrote a file for: the confirm prompt, the page
# arrows a long list grows, the colour picker, and the acknowledgement a cancelled prompt
# sends. Those screens name a key and ask the plugin's catalogue for it, and a plugin that
# holds no line for one of them used to put the key itself on the screen.
#
# This file is that floor. It is read from inside the jar, underneath the plugin's own
# language files, so a key written in messages_<tag>.conf of the plugin wins over the line
# here. An operator who wants other words writes the key in their own file.
#
# Every line names a role and never a colour, like every other line of the suite: <value> is
# a name, <accent> is the brand, <bad> refuses. theme.conf says what those are.

"gui.input.cancelled" = "<tag:'INPUT'> eingabe abgebrochen."
"gui.input.cancel-hint" = "<muted>(tippe <value><keyword></value> zum abbrechen)</muted>"
"gui.input.submit" = "Bestätigen"
"gui.input.cancel" = "Abbrechen"
"gui.confirm.yes" = "<value>bestätigen</value>"
"gui.confirm.no" = "<bad>abbrechen</bad>"
"gui.page.previous" = "<accent>← vorherige seite</accent>"
"gui.page.next" = "<accent>→ nächste seite</accent>"
"gui.colour-picker.title" = "<accent>farbe wählen</accent>"
"gui.colour-picker.custom" = "<cta>eigener hex-code</cta>"
"gui.colour-picker.custom-prompt" = "<cta>gib einen hex-farbcode ein, z. b. #ff5733</cta>"
"gui.colour-picker.clear" = "<bad>farbe entfernen</bad>"
"gui.colour-picker.back" = "<accent>← zurück</accent>"
"gui.colour.white" = "<value>weiß</value>"
"gui.colour.orange" = "<value>orange</value>"
"gui.colour.magenta" = "<value>magenta</value>"
"gui.colour.light-blue" = "<value>hellblau</value>"
"gui.colour.yellow" = "<value>gelb</value>"
"gui.colour.lime" = "<value>hellgrün</value>"
"gui.colour.pink" = "<value>rosa</value>"
"gui.colour.gray" = "<value>grau</value>"
"gui.colour.light-gray" = "<value>hellgrau</value>"
"gui.colour.cyan" = "<value>cyan</value>"
"gui.colour.purple" = "<value>lila</value>"
"gui.colour.blue" = "<value>blau</value>"
"gui.colour.brown" = "<value>braun</value>"
