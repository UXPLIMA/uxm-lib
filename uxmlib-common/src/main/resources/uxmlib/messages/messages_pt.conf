# The words the library's own windows ask for.
#
# The menu engine draws a few screens nobody wrote a file for: the confirm prompt, the page
# arrows a long list grows, the colour picker, and the acknowledgement a cancelled prompt
# sends. Those screens name a key and ask the plugin's catalogue for it, and a plugin that
# holds no line for one of them used to put the key itself on the screen.
#
# This file is that floor. It is read from inside the jar, underneath the plugin's own
# language files, so a key written in messages_<tag>.conf of the plugin wins over the line
# here. An operator who wants other words writes the key in their own file.
#
# Every line names a role and never a colour, like every other line of the suite: <value> is
# a name, <accent> is the brand, <bad> refuses. theme.conf says what those are.

"gui.input.cancelled" = "<tag:'INPUT'> entrada cancelada."
"gui.input.cancel-hint" = "<muted>(digite <value><keyword></value> para cancelar)</muted>"
"gui.input.submit" = "Confirmar"
"gui.input.cancel" = "Cancelar"
"gui.confirm.yes" = "<value>confirmar</value>"
"gui.confirm.no" = "<bad>cancelar</bad>"
"gui.page.previous" = "<accent>← pagina anterior</accent>"
"gui.page.next" = "<accent>→ proxima pagina</accent>"
"gui.colour-picker.title" = "<accent>escolha uma cor</accent>"
"gui.colour-picker.custom" = "<cta>hex personalizado</cta>"
"gui.colour-picker.custom-prompt" = "<cta>digite uma cor hex, ex. #ff5733</cta>"
"gui.colour-picker.clear" = "<bad>limpar cor</bad>"
"gui.colour-picker.back" = "<accent>← voltar</accent>"
"gui.colour.white" = "<value>branco</value>"
"gui.colour.orange" = "<value>laranja</value>"
"gui.colour.magenta" = "<value>magenta</value>"
"gui.colour.light-blue" = "<value>azul claro</value>"
"gui.colour.yellow" = "<value>amarelo</value>"
"gui.colour.lime" = "<value>verde limao</value>"
"gui.colour.pink" = "<value>rosa</value>"
"gui.colour.gray" = "<value>cinza</value>"
"gui.colour.light-gray" = "<value>cinza claro</value>"
"gui.colour.cyan" = "<value>ciano</value>"
"gui.colour.purple" = "<value>roxo</value>"
"gui.colour.blue" = "<value>azul</value>"
"gui.colour.brown" = "<value>marrom</value>"
"gui.colour.green" = "<value>verde</value>"
