name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The line the library is developed against: everything, NMS modules included.
          - name: Paper 26.x
            line: modern
            tasks: build

          # The oldest line the published jar must keep running on. One jar serves both, so this run is
          # what keeps that a checked fact: anything reaching for a 26.x-only symbol fails here. The NMS
          # modules compile against a single line's Mojang mappings and cannot take part, so the covered
          # modules are listed rather than excluded (uxmlib-all pulls them in transitively).
          - name: Paper 1.21.x
            line: legacy
            tasks: >-
              -PmcTarget=1.21
              :uxmlib-common:build :uxmlib-item:build :uxmlib-gui:build :uxmlib-hud:build
              :uxmlib-command:build :uxmlib-condition:build :uxmlib-update:build
              :uxmlib-storage:build :uxmlib-integration:build :uxmlib-redis:build
              :uxmlib-npc:build

    steps:
      - uses: actions/checkout@v7

      # The house style bans the long dash in every file this repository publishes, and the guards that
      # enforce it live in the plugin repositories, where this text only ever arrives inside a jar. The
      # check runs beside the build rather than inside it, so a publish never fails on wording.
      - name: Check the writing style
        if: matrix.line == 'modern'
        run: bash scripts/check-style.sh

      # Two JDKs, on purpose. The compiler has to be 25: paper-api 26.x ships Java 25 class files that an
      # older one cannot read, while the emitted bytecode stays at 21 for the 1.21.x line. Gradle itself,
      # though, runs on 21: Palantir's formatter reaches into javac internals that changed in 25. Listing 21
      # last is what points JAVA_HOME, and with it the daemon, at 21.
      - name: Set up the JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Building the NMS modules decompiles the whole server jar, which takes minutes and needs several
      # gigabytes. The result only changes when the Paper version does, so key the cache on the catalog.
      - name: Cache the decompiled server sources
        if: matrix.line == 'modern'
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/paperweight-userdev
          key: paperweight-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The 25 toolchain lives outside JAVA_HOME here, so Gradle is told where to look for it.
      - name: Build
        run: ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 ${{ matrix.tasks }}

      # The whole cross-version promise rests on the jars being Java 21 even though they are compiled
      # against Paper 26.x, and that is one `options.release` away from silently regressing.
      - name: Check the published bytecode still targets Java 21
        if: matrix.line == 'modern'
        run: |
          status=0
          for jar in uxmlib-*/build/libs/*.jar; do
            case "$jar" in *-sources.jar|*-javadoc.jar|*-standalone.jar) continue ;; esac
            entry=$(unzip -Z1 "$jar" | grep -m1 '^com/uxplima/uxmlib/.*\.class$' || true)
            if [ -z "$entry" ]; then
              continue
            fi
            major=$(unzip -p "$jar" "$entry" | od -An -tu1 -N8 | awk '{print $8}')
            if [ "$major" = "65" ]; then
              echo "ok: $jar targets Java 21"
            else
              echo "::error file=$jar::class file major version $major, expected 65 (Java 21)"
              status=1
            fi
          done
          exit $status

      # uxmlib-all publishes two jars that used to be one file, and the plain one silently turning back into
      # the shaded one is exactly the regression that shipped in 0.5.0: consumers compiled against relocated
      # Configurate types they had no way to produce.
      - name: Check the aggregate jar carries no bundled libraries
        if: matrix.line == 'modern'
        run: |
          plain=$(ls uxmlib-all/build/libs/*.jar | grep -v -e '-sources\.jar$' -e '-javadoc\.jar$' -e '-standalone\.jar$')
          shaded=$(ls uxmlib-all/build/libs/*-standalone.jar)
          if unzip -Z1 "$plain" | grep -q '^com/uxplima/uxmlib/libs/'; then
            echo "::error file=$plain::the aggregate jar contains relocated third-party classes"
            exit 1
          fi
          if ! unzip -Z1 "$shaded" | grep -q '^com/uxplima/uxmlib/libs/configurate/'; then
            echo "::error file=$shaded::the standalone jar is missing its bundled libraries"
            exit 1
          fi
          echo "ok: $plain is the API aggregate, $shaded is the plugin"

      # And that the standalone jar is actually published beside the aggregate rather than only built.
      - name: Check both jars reach a repository
        if: matrix.line == 'modern'
        run: |
          ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 :uxmlib-all:publishToMavenLocal
          dir=$(ls -d ~/.m2/repository/com/uxplima/uxmlib/uxmlib-all/*/)
          ls -1 "$dir"
          ls "$dir" | grep -q -e '-standalone\.jar$' || {
            echo "::error::the standalone jar is missing from the published artifacts"
            exit 1
          }

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.line }}
          path: '**/build/reports/tests/test'
          retention-days: 7
