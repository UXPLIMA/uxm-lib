name: release

on:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - env:
          UXPLIMA_NEXUS_USER: ${{ secrets.UXPLIMA_NEXUS_USER }}
          UXPLIMA_NEXUS_PASS: ${{ secrets.UXPLIMA_NEXUS_PASS }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: ./gradlew build publish -PprojectVersion="$VERSION"
      - env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          pom="https://repo.uxplima.com/repository/maven-releases/com/uxplima/uxmlib/uxmlib-all/$VERSION/uxmlib-all-$VERSION.pom"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --head "$pom")
          echo "$pom answered $code"
          [ "$code" = 200 ]
