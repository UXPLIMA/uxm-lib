name: ci

on:
  # edited: a corrected title is checked again.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: UXPLIMA/.github/.github/workflows/uxm-ci.yml@4de7dadcfc932f88497489c0ba42dbea870e37a9 # main
    permissions:
      contents: read
    with:
      # Public: hosted runners cost nothing here.
      runner: '["ubuntu-latest"]'
      scopes: "common item gui bedrock menu command storage redis integration hud update condition pipeline packet nametags schematic bom all build ci docs release"
      tools-ref: 4de7dadcfc932f88497489c0ba42dbea870e37a9
