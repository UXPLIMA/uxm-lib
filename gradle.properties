# Pin UTF-8 + en-US so Spotless / Palantir formatting is identical on every machine and CI,
# regardless of the host charset or locale.
# 4G, not the Gradle default: paperweight forks Vineflower to decompile the whole server jar for the
# NMS modules, and that step alone wants several gigabytes. At 2G the decompiler gets killed by the
# OOM killer mid-run and the failure surfaces as an opaque "exit code 137".
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx4G

# Parallel + build caching for a snappier multi-module build.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is intentionally OFF: it does not correctly restore the Spotless formatter
# worker classloaders (Palantir/Guava + ktlint), which then fail with a NoClassDefFoundError on a
# cache hit. The build cache + parallel give most of the speed without that fragility.
org.gradle.configuration-cache=false

projectVersion=0.2.0-SNAPSHOT
